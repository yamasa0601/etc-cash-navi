name: GitHub Pages へ公開

on:
  push:
    branches: [main]
  workflow_dispatch:
  # データ更新ワークフローから直接呼べるようにする。
  # Actions が GITHUB_TOKEN で push しても他のワークフローは起動しないため、
  # 上の push トリガーではデータ更新の内容が公開されない。
  workflow_call:
    inputs:
      ref:
        description: >
          チェックアウトする ref。呼び出し元が実行中に作ったコミットを公開したい
          場合に指定する。既定では起動時の SHA になり、更新前の内容が出てしまう。
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # BASE_PATH はリポジトリ名に合わせる。独自ドメインなら / を渡す。
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
